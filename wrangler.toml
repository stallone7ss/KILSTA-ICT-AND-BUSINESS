name = "kilsta-ict-and-business"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"
KILSTA_OFFICIAL_EMAIL = "kilsta2023@gmail.com"

# ------------------------------------------------------------------------------
# CLOUDFLARE HYPERDRIVE POOLING BINDING (OPTIONAL / PRODUCTION)
# ------------------------------------------------------------------------------
# To connect directly to Supabase via Hyperdrive:
#
# Option A (Recommended - via Cloudflare Dashboard):
#   1. Go to your Cloudflare Dashboard -> Workers & Pages -> kilsta-ict-and-business
#   2. Navigate to Settings -> Functions -> Hyperdrive bindings
#   3. Add binding: Variable name = HYPERDRIVE, select your Hyperdrive config.
#
# Option B (via wrangler.toml):
#   Once you run `npx wrangler hyperdrive create kilsta-supabase --connection-string="..."`,
#   uncomment the lines below and paste your 32-character hex ID:
#
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-32-character-hyperdrive-id"
