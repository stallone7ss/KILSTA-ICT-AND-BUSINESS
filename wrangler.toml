# Cloudflare Pages & Hyperdrive Configuration
# Project: KILSTA Business & ICT Consultants

name = "kilsta-ict-and-business"
pages_build_output_dir = "dist"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Hyperdrive Connection Pool to Supabase PostgreSQL
# Configure via: npx wrangler hyperdrive create kilsta-supabase-pool --connection-string="..."
# Or bind in Cloudflare Pages Dashboard -> Settings -> Functions -> Hyperdrive bindings
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "<YOUR_HYPERDRIVE_ID>"

[vars]
ENVIRONMENT = "production"
