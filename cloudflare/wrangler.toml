# Cloudflare Workers Configuration (mirror for --config cloudflare/wrangler.toml)
# Matches Worker project: kilsta-ict-and-business

name = "kilsta-ict-and-business"
main = "./worker.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
ENVIRONMENT = "production"
KILSTA_OFFICIAL_EMAIL = "kilsta2023@gmail.com"

# Hyperdrive connection pool binding:
# [[hyperdrive]]
# binding = "HYPERDRIVE"
# id = "your-hyperdrive-id"
